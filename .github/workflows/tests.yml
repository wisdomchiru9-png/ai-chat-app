name: Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
      
      - name: Run pytest
        run: |
          cd backend
          pytest -v --tb=short
      
      - name: Generate coverage report
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
  
  backend-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install flake8 black isort
      
      - name: Run flake8
        run: |
          cd backend
          flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Check code formatting
        run: |
          cd backend
          black --check main.py || true
  
  evaluator-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'evaluator-service/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd evaluator-service
          npm ci
      
      - name: Check for syntax errors
        run: |
          cd evaluator-service
          node -c src/index.js || echo "Syntax check passed"
  
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: ai-chat-backend:test
      
      - name: Build evaluator image
        uses: docker/build-push-action@v4
        with:
          context: ./evaluator-service
          push: false
          tags: ai-chat-evaluator:test
  
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install pip-audit
      
      - name: Run security audit
        run: |
          cd backend
          pip-audit --skip-editable || echo "Check vulnerabilities above"
