[pytest]
# Pytest configuration for AI Chat Backend tests

minversion = 7.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
