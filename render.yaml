services:
  - type: web
    name: ai-chat-backend
    runtime: docker
    repo: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: local
      - key: DATABASE_URL
        sync: false
