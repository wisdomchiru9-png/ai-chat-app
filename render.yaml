services:
  - type: web
    name: ai-chat-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: ai-chat-db
          property: connectionString
      - key: USE_LOCAL_MODELS
        value: "0"

  - type: web
    name: ai-chat-evaluator
    runtime: docker
    dockerfilePath: ./Dockerfile.evaluator
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_BACKEND_URL
        value: http://ai-chat-backend:10000

databases:
  - name: ai-chat-db
    plan: free
    databaseName: ai_chat_app
    user: ai_chat
